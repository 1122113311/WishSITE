<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#20a9ef">
  <title>Личный сайт Александра Андреевича</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { background: #22adf2; font-family: Georgia, "Times New Roman", serif; }
    .design { position: relative; width: min(100%, 1422px); margin: 0 auto; line-height: 0; }
    .design-image { display: block; width: 100%; height: auto; }
    .continue-link {
      position: absolute; z-index: 1; left: 16.4%; top: 72.9%; width: 68.2%; height: 18.2%;
      display: block; overflow: hidden; border: 0; border-radius: 54px; color: transparent;
      background: transparent; text-decoration: none; -webkit-tap-highlight-color: transparent;
      touch-action: manipulation; transition: transform 100ms ease;
    }
    .continue-link::after {
      content: ""; position: absolute; inset: 8px; border-radius: inherit; opacity: 0;
      background: linear-gradient(180deg, #a95c0018, #8d3b0028);
      box-shadow: inset 0 8px 15px #7a350044, inset 0 -2px 0 #fff4;
      transition: opacity 100ms ease;
    }
    .continue-link:active { transform: translateY(7px) scale(.99); }
    .continue-link:active::after { opacity: 1; }
    .continue-link:focus-visible { outline: 4px dashed white; outline-offset: 3px; }
    .screen-reader { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media (prefers-reduced-motion: reduce) { .continue-link, .continue-link::after { transition: none; } }
  </style>
</head>
<body>
  <main class="design">
    <img class="design-image" src="assets/racing-home.webp" alt="Личный сайт Александра Андреевича: приветствие Андрея и Юлии, фотография пары и гоночная кнопка «Посмотреть, что там дальше»">
    <a class="continue-link" href="wishes.html" aria-label="Посмотреть, что там дальше">
      <span class="screen-reader">Посмотреть, что там дальше</span>
    </a>
  </main>
</body>
</html>
